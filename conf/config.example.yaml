# 高级示例，不会自动加载。可复制需要的字段到 config.yaml。
zabbix:
  server: zabbix.example.com
  hostname: linux-01
  port: 10051
  send_timeout_seconds: 5

runtime:
  max_workers: 16

logging:
  level: INFO                # 普通日志等级：DEBUG / INFO / WARNING / ERROR / CRITICAL
  console: true              # false 时仅写日志文件
  retention_days: 14         # 历史日志保留天数
  # 审计始终完整记录并逐条发送以取得单指标确认，不受 level 影响。

system: true

interfaces:
  - device: eth0
    name: wan                 # 可选别名；省略时使用 device
  - device: veth1
    namespace: ns1           # 可选；普通目标不填写
    name: wan_ns1            # 跨 Namespace 的监控名称也必须唯一

ping:
  - address: 1.1.1.1
    name: dns                # 省略时使用 address
    duration_seconds: 50     # 每轮持续时间，不是执行周期
    # source_ip: 192.0.2.10  # 可选源 IPv4；必须实际配置在本机的接口上
  - address: 8.8.8.8
    namespace: ns1
    name: dns_ns1
    # source_ip: 192.0.2.20  # 使用 namespace 时，源 IP 必须属于该 namespace

tcp:
  - address: example.com
    port: 443
    name: web                # 最终监控名称为 web:443，name 中不要重复填写端口
    count: 10                # 每轮探测次数，不是秒数；旧 INI 默认是 50 次
    connect_timeout_seconds: 1
    # namespace: ns1         # TCP 同样支持 Namespace
