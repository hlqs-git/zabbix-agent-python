[zabbix conf]
; zabbix 服务端IP地址;
Server=1.1.1.1
; zabbix 服务端端口;
ServerPort=10051
; 此机器主机名;
Hostname=hostname
; 自动发现时间,按小时;
DiscoveryHours=12

[zabbix item]
; 是否开启系统负载监控,开启为true,关闭为false;
Item.sys = true
; 是否开启接口流量监控,开启为true,关闭为false;
Item.if = true
; 是否开启ping监控,开启为true,关闭为false;
Item.ping = true
; 是否开启namespace接口流量监控,开启为true,关闭为false;
Item.ns_if = false
; 是否开启namespace ping监控,开启为true,关闭为false;
Item.ns_ping = false

[if]
; 监控接口名,多设备名用英文逗号分割；
if_nic = ens5f0
; 监控接口名,zabbix服务端使用别名,别名和接口名用冒号分割,多接口用逗号分割;
; if_nic_alias = wan: eth3, lan:eth4

[ping]
; ping监控时间,单位为秒,每分钟执行50,每五分钟执行250;
ping_time = 50
; ping监控,多目标用逗号分割;
ping_address = 1.1.1.1,8.8.8.8
; ping监控,zabbix服务端使用别名,别名与目标用冒号分割,多目标用逗号分割
; ping_address_alias = dns1: 223.5.5.5, dns2:223.6.6.6

; tcping监控时间,单位为秒,每分钟执行50,每五分钟执行250;
tcping_time = 50
; tcping监控,多目标用逗号分割;
tcping_address = 1.1.1.1:80,8.8.8.8:80
; tcping监控,zabbix服务端使用别名,别名与目标用冒号分割,多目标用逗号分割
; tcping_address_alias = dns1:223.5.5.5:80, dns2:223.6.6.6:80

[ns_if]
; 监控namespace中接口,多设备名用英文逗号分割;
ns_if_nic = ns1: veth1, ns2: veth2
; 监控namespace中接口,zabbix服务端使用别名,别名和接口名用冒号分割,多接口用逗号,注意引号
; ns_if_nic_alias = {"ns1": {"wan0": "veth1", "lan0": "veth2"}, "ns2": {"wan1": "veth11", "lan1": "veth12"}}

[ns_ping]
# ping监控时间,单位为秒,每分钟执行50,每五分钟执行250;
ns_ping_time = 50
# namespace ping监控,多目标用逗号分割;
ns_ping_address = ns1: 1.1.1.1, ns2: 8.8.8.8
; namespace ping监控,zabbix服务端使用别名,别名与目标用冒号分割,多目标用逗号分割,注意引号(暂不支持)
; ns_ping_address_alias = {"ns1": {"dns1": "223.5.5.5", "dns2: 223.6.6.6"}, "ns2": {"dns1": "223.5.5.5", "dns2": "223.6.6.6"}}

; 未开发功能
; tcping监控时间,单位为秒,每分钟执行50,每五分钟执行250;
; ns_tcping_time = 50
; namespace tcping监控,多目标用逗号分割;
; ns_tcping_address = ns1: 1.1.1.1:80, ns2: 8.8.8.8:80
